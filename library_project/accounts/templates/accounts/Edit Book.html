{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Book - Digital Library</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="navbar">
      <div class="nav-left">
        <a href="{% url 'home' %}">Digital Library 📖</a>
        <a href="{% url 'search_books' %}">Books</a>
      </div>
      <div class="user-info">
        <img src="{% static 'images/default-avtar1.jpg' %}" id="userAvatar" alt="User Avatar" />
        <span id="usernameDisplay">Admin Panel</span>
        <a href="{% url 'logout' %}" id="logoutLink">Logout</a>
      </div>
    </div>

    <div class="main-content">
      <div class="info-card">
        <h2>Edit Book Data</h2>
        <form method="POST"> {% csrf_token %} <label><i class="fa-solid fa-book"></i> Book Title:</label>
          <input type="text" value="Learn C++" required />
          <button type="submit" class="btn-save">Save Changes</button>
        </form>
        <a href="{% url 'home' %}" class="back-link">← Back to Dashboard</a>
      </div>
    </div>
    <script src="{% static 'js/editbook.js' %}"></script>
  </body>
</html>
