{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>User Dashboard - Digital Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <div class="navbar">
      <div>
        <a href="{% url 'home' %}">Digital Library 📖</a>
        <a href="{% url 'search_books' %}">Books</a>
        <a href="{% url 'login' %}" id="loginLink">Login</a>
        <a href="{% url 'signup' %}" id="signupLink">Sign Up</a>
        <a href="{% url 'logout' %}" id="logoutLink" style="display:none;">Logout</a>
      </div>

      <div class="user-info">
        <img id="userAvatar" src="{% static 'images/default-avtar1.jpg' %}" />
        <span id="usernameDisplay">Welcome Guest</span>
      </div>
    </div>

    <div class="container">
      <h2>User Dashboard - Available Books</h2>
      <table>
        <thead>
          <tr>
            <th>Book Name</th>
            <th>Author</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="booksBody"></tbody>
      </table>
    </div>

    <script src="{% static 'js/userview.js' %}"></script>
  </body>
</html>
